<!DOCTYPE html>
<html>

<head>
    <title>IV</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-size: 7pt;
            font-family: sans-serif;
            --pool-size: 80px;
            --view-size: 320px;
        }

        #DROP {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;

            &.DRAG {
                display: grid;
            }

            & div {
                background-color: rgba(255, 255, 255, .75)
            }

            & input {
                display: none;
            }
        }

        #POOL {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(var(--pool-size), 1fr));
            grid-auto-rows: var(--pool-size);
            grid-auto-columns: var(--pool-size);
            background-color: rgb(125, 51, 51);
        }

        #VIEW {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(var(--view-size), 1fr));
            grid-auto-rows: 100vh;
            grid-auto-columns: var(--view-size);
            background-color: rgb(17, 83, 40);
            min-height: 100vh;
        }

        & figure {
            display: flex;
            margin: 2px;
            box-sizing: border-box;
            border: silver solid 1px;
            background-color: rgba(0, 0, 0, .25);
            align-content: center;
            justify-content: center;

            & img {
                object-fit: contain;
                min-width: 0;
                min-height: 0;
                cursor: pointer;
            }

            & svg {
                flex-grow: 1;
                cursor: pointer;
            }

        }

        b {
            position: absolute;
            margin: 1pt;
            padding: 1pt;
            border-radius: 1pt;
            background-color: rgba(255, 255, 255, .5);
        }
    </style>

</head>

<body>
    <b>
        drop images to add to view (green) •
        ctrl-drop to also or shift-drop to only add to pool (red) •
        click image in pool to add to view •
        click image in view to move and zoom •
        ctrl-click image in view to add to pool •
        shift-click to remove image from pool or view
    </b>
    <label id="DROP">
        <div> </div><input type="file" id="FILE" title="drop images to add" multiple accept="image/*">
    </label>
    <div id="POOL"></div>
    <div id="VIEW"></div>
    <script>
        //  drop files onto overlay to add to pool, ctrl-drop to also add to view, shift-drop to only add to view.
        //  close image in pool with shift-click. add to view with click.

        /** @type {HTMLLabelElement} */
        let dropNode = window.DROP;

        window.addEventListener("dragover", (event) => {
            if (![...event.dataTransfer.items].some((item) => item.kind === "file")) return;
            event.preventDefault();
            dropNode.className = "DRAG";
            if (dropNode.contains(event.target)) return;
            event.dataTransfer.dropEffect = "none";
        });

        dropNode.addEventListener("drop", (event) => {
            event.preventDefault();
            [...event.dataTransfer.items].map(item => item.getAsFile()).filter(Boolean).forEach((file) => {
                if (file.type.startsWith("image/")) {
                    insertImageIntoPool(URL.createObjectURL(file), !event.shiftKey, !event.ctrlKey);
                } else if (file.type.startsWith("text/")) {
                    Object.assign(new FileReader(), {
                        onload: ({ target }) => {
                            [...target.result.matchAll(/[^\r\n]+/g)].forEach(imageUrl => {
                                insertImageIntoPool(imageUrl, !event.shiftKey, !event.ctrlKey);
                            });
                        }
                    }).readAsText(file);
                }
            });
        });

        dropNode.addEventListener("mousemove", () => {
            dropNode.className = "";
        });

        // ### drag and zoom selected image in view, close with shift-click and ctrl-click

        /** @type {{moveImage(event: MouseEvent): unknown; zoomImage(event: WheelEvent): unknown} | undefined} */
        let selectedImage = undefined;

        window.addEventListener("mousemove", (event) => {
            selectedImage?.moveImage(event)
        });

        window.addEventListener("mouseup", () => {
            selectedImage = undefined
        });

        window.addEventListener("wheel", (event) => {
            selectedImage?.zoomImage(event)
        });

        let poolNode = window.POOL;

        /** @param {string} imageHref @param {boolean} insertIntoView @param {boolean} andNotIntoPool */
        function insertImageIntoPool(imageHref, insertIntoView, andNotIntoPool) {
            /** @type {HTMLImageElement} */
            let imageNode = document.createElement("img");
            imageNode.src = imageHref;
            imageNode.decode().then(() => {
                /** @type {HTMLElement} */
                let figureNode = document.createElement("figure");
                let [imageWidth, imageHeight] = [imageNode.width, imageNode.height];
                if (insertIntoView) {
                    insertImageIntoView(imageHref, imageWidth, imageHeight);
                    if (andNotIntoPool) return;
                }
                imageNode.addEventListener("click", (event) => {
                    if (event.shiftKey) {
                        poolNode.removeChild(figureNode);
                    } else {
                        insertImageIntoView(imageHref, imageWidth, imageHeight)
                    }
                });
                figureNode.appendChild(imageNode);
                poolNode.appendChild(figureNode);
            });
        }

        /** @param {FileSystemEntry|null} file
         * */
        function insertImageListIntoPool(file) {
            Object.assign(new FileReader(), {
                onload: (event) => {
                    console.log("Dropped", [...event.target.result.matchAll(/[^\r\n]+/g)])
                }
            }).readAsText(file);
        }

        let viewNode = window.VIEW;

        /** @param {string} imageHref @param {number} imageWidth @param {number} imageHeight */
        function insertImageIntoView(imageHref, imageWidth, imageHeight) {

            let clientX = 0, clientY = 0, clientScale = 1, imageX = 0, imageY = 0, imageScale = 1, offsetX = 0, offsetY = 0;

            let imgNode = document.createElementNS("http://www.w3.org/2000/svg", "image");
            imgNode.setAttribute("width", imageWidth);
            imgNode.setAttribute("height", imageHeight);
            imgNode.setAttributeNS("http://www.w3.org/1999/xlink", "href", imageHref);

            let svgNode = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svgNode.setAttribute("viewBox", `0 0 ${imageWidth} ${imageHeight}`);
            svgNode.appendChild(imgNode);

            let figNode = document.createElement("figure");
            figNode.appendChild(svgNode);
            viewNode.appendChild(figNode);

            function moveImage(event) {
                if (selectedImage !== currentImage) return;
                event.preventDefault();
                offsetX = Math.min(Math.max(clientX + event.clientX * clientScale - imageX * imageScale, imageWidth - imageScale * imageWidth), 0);
                offsetY = Math.min(Math.max(clientY + event.clientY * clientScale - imageY * imageScale, imageHeight - imageScale * imageHeight), 0);
                imgNode.setAttribute("transform", `translate(${offsetX} ${offsetY}) scale(${imageScale})`);
            }

            function zoomImage(event) {
                if (selectedImage !== currentImage) return;
                imageScale = Math.min(Math.max(imageScale * Math.pow(1.2, event.wheelDelta / 180), 1), 1000);
                moveImage(event);
            }

            let currentImage = { moveImage, zoomImage };

            svgNode.addEventListener("click", (event) => {
                if (event.ctrlKey) {
                    insertImageIntoPool(imageHref, false, false);
                } else if (event.shiftKey) {
                    viewNode.removeChild(figNode);
                }
            });

            svgNode.addEventListener("mousedown", (event) => {
                if (selectedImage) return;
                event.preventDefault();
                var imageRect = imgNode.getBoundingClientRect();
                clientScale = imageWidth / imageRect.width * imageScale; // screen to viewbox factor
                imageX = (event.clientX - imageRect.x) * clientScale / imageScale;
                imageY = (event.clientY - imageRect.y) * clientScale / imageScale;
                clientX = offsetX - event.clientX * clientScale + imageX * imageScale;
                clientY = offsetY - event.clientY * clientScale + imageY * imageScale;
                selectedImage = currentImage;
            });
            svgNode.addEventListener("wheel", (event) => {
                selectedImage && event.preventDefault();
            });
        }

    </script>
</body>

</html>
